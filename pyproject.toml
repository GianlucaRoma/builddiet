[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "builddiet"
version = "0.2.0"
description = "Point it at a folder: it proves by experiment what can be brought back byte-for-byte, what that costs, and plans the cheapest verified way to reclaim disk space."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["disk-space", "build", "cache", "eviction", "developer-tools"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Build Tools",
    "Topic :: System :: Filesystems",
]

[project.urls]
Homepage = "https://dietsys.github.io/builddiet/"
Documentation = "https://github.com/dietsys/builddiet#documentation"
Changelog = "https://github.com/dietsys/builddiet/blob/main/CHANGELOG.md"

[project.scripts]
builddiet = "builddiet.cli:main"

[tool.setuptools.packages.find]
include = ["builddiet*"]
